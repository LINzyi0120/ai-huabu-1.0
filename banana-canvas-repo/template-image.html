<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 图像工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#8B5CF6' } // Purple
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #f5f5f5; }
        .masonry-grid { column-count: 2; column-gap: 16px; }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1536px) { .masonry-grid { column-count: 4; } }
        .masonry-item { break-inside: avoid; margin-bottom: 16px; }
    </style>
</head>
<body class="h-screen flex text-slate-800">

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center" onclick="this.classList.add('hidden')">
        <img id="lightboxImg" class="max-w-[90vw] max-h-[90vh] object-contain" src="">
    </div>

    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-20 shadow-xl">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-500 to-pink-500 flex items-center gap-2">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                图像工坊
            </h1>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Settings -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">连接设置</h3>
                <input type="password" id="apiKey" placeholder="输入 API Key" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-1 focus:ring-purple-500">
                <input type="text" id="apiBaseUrl" value="https://api.bltcy.ai" placeholder="API Base URL" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-1 focus:ring-purple-500">
            </div>

            <hr class="border-slate-100">

            <!-- Parameters -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">生图配置</h3>
                <div>
                    <label class="text-sm font-medium text-slate-600 mb-1 block">图生模型</label>
                    <select id="modelSelector" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none">
                        <option value="dall-e-3">dall-e-3</option>
                        <option value="midjourney">midjourney</option>
                        <option value="stable-diffusion-xl">stable-diffusion-xl</option>
                        <option value="flux">flux.1</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-sm font-medium text-slate-600 mb-1 block">分辨率/比例</label>
                        <select id="imageSize" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none">
                            <option value="1024x1024">1:1 (1024x1024)</option>
                            <option value="1024x1792">9:16 (竖屏)</option>
                            <option value="1792x1024">16:9 (横屏)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium text-slate-600 mb-1 block">生成数量</label>
                        <input type="number" id="imageCount" value="1" min="1" max="4" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="text-sm font-medium text-slate-600 mb-2 block">垫图/参考图 (Image-to-Image)</label>
                    <div class="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center cursor-pointer hover:bg-slate-50 transition-colors" onclick="document.getElementById('refImageInput').click()">
                        <span class="text-sm text-slate-500 font-medium">+ 点击上传参考图</span>
                        <input type="file" id="refImageInput" class="hidden" accept="image/*" onchange="handleRefImage(event)">
                    </div>
                    <div id="refPreviewContainer" class="mt-2 hidden relative inline-block">
                        <img id="refPreview" src="" class="h-20 rounded-lg border border-slate-200 shadow-sm object-cover">
                        <button onclick="clearRefImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 text-xs shadow">✕</button>
                    </div>
                </div>
            </div>
            
            <button onclick="clearCanvas()" class="w-full py-2 text-red-500 bg-white border border-red-200 hover:bg-red-50 text-sm font-medium rounded-lg transition-colors">清空画廊</button>
        </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="flex-1 flex flex-col relative">
        <!-- Input Overlay (Top) -->
        <div class="bg-white/80 backdrop-blur-md border-b border-slate-200 p-6 z-10">
            <div class="max-w-4xl mx-auto">
                <div class="relative">
                    <textarea 
                        id="promptInput" 
                        class="w-full bg-white border border-slate-300 rounded-2xl pl-4 pr-16 py-4 outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 resize-none shadow-sm text-sm"
                        placeholder="描述你想要的画面... (Enter 生成)"
                        rows="2"
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();generateImage();}"
                    ></textarea>
                    <button 
                        onclick="generateImage()" 
                        class="absolute right-3 bottom-3 h-9 w-10 bg-purple-500 hover:bg-purple-600 text-white rounded-xl flex items-center justify-center transition-colors shadow-md"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Gallery -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            <div id="gallery" class="masonry-grid w-full">
                <!-- Empty State -->
                <div id="emptyGallery" class="col-span-full h-64 flex flex-col items-center justify-center text-slate-400 opacity-60">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <p class="mt-4 font-medium">画廊空白，开始生成吧</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentRefImage = null;

        function loadConfig() {
            document.getElementById('apiKey').value = localStorage.getItem('img_apiKey') || '';
            const savedUrl = localStorage.getItem('img_baseUrl');
            if(savedUrl) document.getElementById('apiBaseUrl').value = savedUrl;
        }

        function saveConfig() {
            localStorage.setItem('img_apiKey', document.getElementById('apiKey').value);
            localStorage.setItem('img_baseUrl', document.getElementById('apiBaseUrl').value);
        }

        function handleRefImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentRefImage = e.target.result;
                document.getElementById('refPreview').src = currentRefImage;
                document.getElementById('refPreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearRefImage() {
            currentRefImage = null;
            document.getElementById('refPreviewContainer').classList.add('hidden');
            document.getElementById('refImageInput').value = '';
        }

        function clearCanvas() {
            document.getElementById('gallery').innerHTML = `
                <div id="emptyGallery" class="col-span-full h-64 flex flex-col items-center justify-center text-slate-400 opacity-60">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <p class="mt-4 font-medium">画廊空白，开始生成吧</p>
                </div>
            `;
        }

        async function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return alert('请输入提示词');

            saveConfig();
            const key = document.getElementById('apiKey').value;
            const url = document.getElementById('apiBaseUrl').value.replace(/\/$/, '');
            const model = document.getElementById('modelSelector').value;
            const size = document.getElementById('imageSize').value;
            const n = parseInt(document.getElementById('imageCount').value);

            if (!key) return alert("配置 API Key 后才能使用");

            document.getElementById('promptInput').value = '';
            
            const empty = document.getElementById('emptyGallery');
            if (empty) empty.style.display = 'none';

            // Create loading card
            const gallery = document.getElementById('gallery');
            const cardId = 'img_' + Date.now();
            const loadingCard = document.createElement('div');
            loadingCard.className = 'masonry-item bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col items-center justify-center min-h-[200px] gap-3 text-purple-500';
            loadingCard.id = cardId;
            loadingCard.innerHTML = `<svg class="animate-spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><span class="text-xs font-bold uppercase tracking-wider">绘制中...</span>`;
            
            gallery.prepend(loadingCard);

            try {
                const payload = { model, prompt, size, n };
                if (currentRefImage) payload.image = currentRefImage;

                const res = await fetch(`${url}/v1/images/generations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                
                // Remove loading card
                loadingCard.remove();

                data.data.forEach(img => {
                    const finalUrl = img.url || `data:image/png;base64,${img.b64_json}`;
                    
                    const item = document.createElement('div');
                    item.className = 'masonry-item bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden group hover:-translate-y-1 transition-transform cursor-pointer relative';
                    item.onclick = () => {
                        document.getElementById('lightboxImg').src = finalUrl;
                        document.getElementById('lightbox').classList.remove('hidden');
                    };
                    item.innerHTML = `
                        <img src="${finalUrl}" class="w-full h-auto block" loading="lazy">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors flex items-end p-4 opacity-0 group-hover:opacity-100">
                            <p class="text-white text-xs drop-shadow-md line-clamp-2">${prompt}</p>
                        </div>
                    `;
                    gallery.prepend(item);
                });

            } catch (e) {
                loadingCard.className = "masonry-item bg-red-50 rounded-2xl p-4 border border-red-100 min-h-[100px] flex items-center";
                loadingCard.innerHTML = `<span class="text-red-500 text-xs break-all">Error: ${e.message}</span>`;
            }
        }

        loadConfig();
    </script>
</body>
</html>
