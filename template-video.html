<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 视频工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#EF4444' } // Red
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    </style>
</head>
<body class="h-screen flex selection:bg-red-500/30">

    <!-- Sidebar -->
    <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col z-20 shadow-2xl relative">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-xl font-bold text-red-500 flex items-center gap-2 tracking-wide">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                视频工坊
            </h1>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Settings -->
            <div class="space-y-4">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">配置信息</h3>
                <input type="password" id="apiKey" placeholder="输入 API Key" class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 text-slate-300 rounded-lg outline-none focus:border-red-500 transition-colors">
                <input type="text" id="apiBaseUrl" value="https://api.bltcy.ai" placeholder="API Base URL" class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 text-slate-300 rounded-lg outline-none focus:border-red-500 transition-colors">
            </div>

            <hr class="border-slate-800">

            <!-- Parameters -->
            <div class="space-y-4">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">生成参数</h3>
                
                <div>
                    <label class="text-sm font-medium text-slate-400 mb-1 block">视频模型</label>
                    <select id="modelSelector" class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 text-slate-300 rounded-lg outline-none focus:border-red-500">
                        <option value="sora">Sora</option>
                        <option value="runway-gen3">Runway Gen-3</option>
                        <option value="luma-dream-machine">Luma Dream Machine</option>
                        <option value="kling">Kling</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-sm font-medium text-slate-400 mb-2 block">首尾帧图像 (图生视频)</label>
                    <div class="border border-dashed border-slate-700 bg-slate-900/50 rounded-xl p-4 text-center cursor-pointer hover:border-red-500/50 hover:bg-slate-800 transition-all" onclick="document.getElementById('refImageInput').click()">
                        <span class="text-xs text-slate-500 font-medium">+ 上传首帧图片</span>
                        <input type="file" id="refImageInput" class="hidden" accept="image/*" onchange="handleRefImage(event)">
                    </div>
                    <div id="refPreviewContainer" class="mt-2 hidden relative inline-block">
                        <img id="refPreview" src="" class="h-24 w-auto rounded border border-slate-700 object-cover shadow-lg">
                        <button onclick="clearRefImage()" class="absolute -top-2 -right-2 bg-red-600 hover:bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs transition-colors shadow-sm">✕</button>
                    </div>
                </div>
                
                <div>
                    <label class="text-sm font-medium text-slate-400 mb-1 block">分辨率/比例</label>
                    <select id="resolution" class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 text-slate-300 rounded-lg outline-none focus:border-red-500">
                        <option value="1080p">1080p (16:9)</option>
                        <option value="720p">720p (16:9)</option>
                        <option value="1:1">1:1 (Square)</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-sm font-medium text-slate-400 mb-1 block">镜头运镜 (可选)</label>
                    <input type="text" id="cameraMotion" placeholder="例如: pan left, zoom in..." class="w-full px-3 py-2 text-sm bg-slate-950 border border-slate-800 text-slate-300 rounded-lg outline-none focus:border-red-500 transition-colors">
                </div>
            </div>
            
            <div class="pt-6">
                <button onclick="clearCanvas()" class="w-full py-2.5 text-red-500 bg-red-500/10 hover:bg-red-500/20 text-sm font-medium rounded-lg transition-colors border border-red-500/30">清空工作区</button>
            </div>
        </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex flex-col relative bg-slate-950">
        <!-- Input Area (Bottom docked similar to Sora UI) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-full max-w-3xl z-20 px-4">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-2 shadow-2xl flex items-end gap-2 focus-within:border-red-500/50 transition-colors">
                <textarea 
                    id="promptInput" 
                    class="flex-1 bg-transparent border-none px-4 py-3 outline-none resize-none text-sm min-h-[48px] max-h-[120px]"
                    placeholder="描述视频的画面内容、动作和风格..."
                    oninput="this.style.height='48px';this.style.height=this.scrollHeight+'px'"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();generateVideo();}"
                ></textarea>
                <button 
                    onclick="generateVideo()" 
                    class="h-12 w-12 shrink-0 bg-white hover:bg-red-50 text-slate-900 rounded-2xl flex items-center justify-center transition-colors shadow-sm font-bold"
                >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <!-- Video Gallery Grid -->
        <div class="flex-1 overflow-y-auto p-6 pb-40">
            <div id="gallery" class="grid-layout w-full max-w-7xl mx-auto">
                <!-- Empty State -->
                <div id="emptyGallery" class="col-span-full h-[60vh] flex flex-col items-center justify-center text-slate-600">
                    <svg width="64" height="64" stroke-width="1.5" viewBox="0 0 24 24" fill="none" class="opacity-30 mb-4"><path stroke="currentColor" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z"/><rect stroke="currentColor" x="3" y="6" width="12" height="12" rx="2"/></svg>
                    <p class="font-medium tracking-wide">你的视频创作将在这里呈现</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentRefImage = null;
        let pollIntervals = {};

        function loadConfig() {
            document.getElementById('apiKey').value = localStorage.getItem('vid_apiKey') || '';
            const savedUrl = localStorage.getItem('vid_baseUrl');
            if(savedUrl) document.getElementById('apiBaseUrl').value = savedUrl;
        }

        function saveConfig() {
            localStorage.setItem('vid_apiKey', document.getElementById('apiKey').value);
            localStorage.setItem('vid_baseUrl', document.getElementById('apiBaseUrl').value);
        }

        function handleRefImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentRefImage = e.target.result;
                document.getElementById('refPreview').src = currentRefImage;
                document.getElementById('refPreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearRefImage() {
            currentRefImage = null;
            document.getElementById('refPreviewContainer').classList.add('hidden');
            document.getElementById('refImageInput').value = '';
        }

        function clearCanvas() {
            Object.values(pollIntervals).forEach(clearInterval); // Stop any polling
            pollIntervals = {};
            document.getElementById('gallery').innerHTML = `
                <div id="emptyGallery" class="col-span-full h-[60vh] flex flex-col items-center justify-center text-slate-600">
                    <svg width="64" height="64" stroke-width="1.5" viewBox="0 0 24 24" fill="none" class="opacity-30 mb-4"><path stroke="currentColor" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z"/><rect stroke="currentColor" x="3" y="6" width="12" height="12" rx="2"/></svg>
                    <p class="font-medium tracking-wide">你的视频创作将在这里呈现</p>
                </div>
            `;
        }

        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt && !currentRefImage) return alert('请输入提示词或上传参考图');

            saveConfig();
            const key = document.getElementById('apiKey').value;
            const url = document.getElementById('apiBaseUrl').value.replace(/\/$/, '');
            const model = document.getElementById('modelSelector').value;
            const resVal = document.getElementById('resolution').value;
            const motion = document.getElementById('cameraMotion').value;

            if (!key) return alert("配置 API Key 后才能使用");

            document.getElementById('promptInput').value = '';
            
            const empty = document.getElementById('emptyGallery');
            if (empty) empty.style.display = 'none';

            // Create loading card
            const gallery = document.getElementById('gallery');
            const cardId = 'vid_' + Date.now();
            const card = document.createElement('div');
            card.className = 'bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col shadow-xl';
            card.id = cardId;
            card.innerHTML = `
                <div class="h-48 bg-slate-950 flex flex-col items-center justify-center relative border-b border-slate-800">
                     <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px] opacity-20"></div>
                     <svg class="animate-spin text-red-500 mb-3" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                     <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest" id="status_${cardId}">提交任务中...</span>
                </div>
                <div class="p-4 bg-slate-900">
                     <p class="text-xs text-slate-400 line-clamp-3">${prompt || '图生视频'}</p>
                </div>
            `;
            
            // Newest first
            gallery.prepend(card);

            try {
                const payload = { model, prompt, resolution: resVal };
                if (currentRefImage) payload.image_url = currentRefImage;
                if (motion) payload.motion = motion; // common custom parameter

                const result = await fetch(`${url}/v1/video/generations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify(payload)
                });

                if (!result.ok) throw new Error(await result.text());
                const data = await result.json();

                if (data.url || (data.data && data.data[0] && data.data[0].url)) {
                    renderVideo(cardId, data.url || data.data[0].url, prompt);
                } else if (data.task_id || data.id) {
                    const taskId = data.task_id || data.id;
                    document.getElementById(`status_${cardId}`).textContent = "队列中 / 渲染中";
                    pollStatus(cardId, taskId, key, url, prompt);
                } else {
                    throw new Error("无法解析的服务端响应");
                }

            } catch (e) {
                renderError(cardId, e.message);
            }
        }

        async function pollStatus(cardId, taskId, key, baseUrl, oprompt) {
            let limit = 0;
            pollIntervals[cardId] = setInterval(async () => {
                limit++;
                if(limit > 120) { // 10 minutes max usually for video
                    clearInterval(pollIntervals[cardId]);
                    renderError(cardId, "渲染超时 (10分钟)");
                    return;
                }

                try {
                    const res = await fetch(`${baseUrl}/v1/video/status?task_id=${taskId}`, {
                        headers: { 'Authorization': `Bearer ${key}` }
                    });
                    if(!res.ok) return; // Silent skip for temp errors
                    
                    const data = await res.json();
                    const state = String(data.status).toLowerCase();
                    const stLabel = document.getElementById(`status_${cardId}`);

                    if (state === 'success' || state === 'completed') {
                        clearInterval(pollIntervals[cardId]);
                        renderVideo(cardId, data.url || data.video_url || (data.data && data.data[0].url), oprompt);
                    } else if (state === 'failed' || state === 'error') {
                        clearInterval(pollIntervals[cardId]);
                        renderError(cardId, data.error || "生成失败");
                    } else if (stLabel) {
                        stLabel.textContent = `渲染中 ${data.progress ? '('+data.progress+'%)' : ''}`;
                    }
                } catch(e) {
                    console.log("Polling issue:", e);
                }
            }, 5000);
        }

        function renderVideo(id, vUrl, prompt) {
            const card = document.getElementById(id);
            if(!card) return;
            card.innerHTML = `
                <div class="relative bg-black group w-full h-auto aspect-video">
                    <video src="${vUrl}" controls loop autoplay muted class="w-full h-full object-cover"></video>
                </div>
                <div class="p-4 bg-slate-900 border-t border-slate-800 flex items-start gap-3">
                    <p class="text-xs text-slate-300 line-clamp-3 flex-1 flex items-center gap-2">
                        <svg class="shrink-0 text-slate-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        ${prompt || '无文本提示词'}
                    </p>
                    <a href="${vUrl}" target="_blank" download class="text-slate-500 hover:text-white transition-colors" title="下载"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></a>
                </div>
            `;
        }

        function renderError(id, errMsg) {
            const card = document.getElementById(id);
            if(!card) return;
            card.innerHTML = `
                <div class="h-32 bg-red-950/20 flex flex-col items-center justify-center border-b border-slate-800 p-4">
                    <svg class="text-red-500 mb-2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span class="text-xs font-medium text-red-500 break-all text-center">${errMsg}</span>
                </div>
            `;
        }

        loadConfig();
    </script>
</body>
</html>
